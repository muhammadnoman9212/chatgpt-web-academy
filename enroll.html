<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Enroll Now | Almadni Quranic Academy</title>

    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <header class="header">
      <img
        src="images/logo.svg"
        alt="Almadni Quranic Academy Logo"
        height="50"
      />
      <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="courses.html">Courses</a>
        <a href="contact.html">Contact</a>
        <a href="enroll.html">Enroll</a>
      </nav>
    </header>

    <section>
      <h2>Student Enrollment Form</h2>
      <p>
        Please fill out the form below to enroll in Almadni Quranic Academy. We
        offer a **free trial class** for students of all ages.
      </p>
    </section>

    <section class="contact-form">
        <form id="enrollForm">
        <input
          type="text"
          name="student_name"
          placeholder="Student Full Name"
          required
        />

        <input type="number" name="age" placeholder="Age" required />

        <select name="gender" required>
          <option value="">Select Gender</option>
          <option>Male</option>
          <option>Female</option>
        </select>

        <select name="course" required>
          <option value="">Select Course</option>
          <option>Noorani Qaida</option>
          <option>Quran Reading with Tajweed</option>
          <option>Hifz-ul-Quran</option>
          <option>Islamic Studies</option>
          <option>Arabic Language Basics</option>
        </select>

        <select name="class_type" required>
          <option value="">Class Type</option>
          <option>One-to-One</option>
          <option>Group Class</option>
        </select>

        <input
          type="text"
          name="parent_name"
          placeholder="Parent / Guardian Name (if child)"
        />

        <input
          type="text"
          name="whatsapp"
          placeholder="WhatsApp Number"
          required
        />

        <input type="email" name="email" placeholder="Email Address" />

        <textarea
          name="message"
          placeholder="Any special requirement or message"
        ></textarea>

        <button type="submit" class="btn">Submit via WhatsApp</button>
      </form>
    </section>

    <footer>
      <p>© 2025 Almadni Quranic Academy | Online Quran Learning Worldwide</p>
    </footer>

    <!-- WhatsApp Button -->
    <a href="https://wa.me/923001234567" class="whatsapp-btn" target="_blank">
      WhatsApp
    </a>
    <script>
        document.getElementById("enrollForm").addEventListener("submit", function(e) {
            e.preventDefault();
        
            let studentName = document.querySelector('[name="student_name"]').value;
            let age = document.querySelector('[name="age"]').value;
            let gender = document.querySelector('[name="gender"]').value;
            let course = document.querySelector('[name="course"]').value;
            let classType = document.querySelector('[name="class_type"]').value;
            let parentName = document.querySelector('[name="parent_name"]').value;
            let whatsapp = document.querySelector('[name="whatsapp"]').value;
            let email = document.querySelector('[name="email"]').value;
            let message = document.querySelector('[name="message"]').value;
        
            let text =
        `New Enrollment – Almadni Quranic Academy
        
        Student Name: ${studentName}
        Age: ${age}
        Gender: ${gender}
        Course: ${course}
        Class Type: ${classType}
        Parent/Guardian: ${parentName}
        WhatsApp: ${whatsapp}
        Email: ${email}
        
        Message:
        ${message}`;
        
            let phoneNumber = "923167577929"; // ← REPLACE with your WhatsApp number
        
            let whatsappURL = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(text)}`;
        
            window.open(whatsappURL, "_blank");
        });
        </script>
        
  </body>
</html>
